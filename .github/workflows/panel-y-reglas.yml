name: Panel y reglas

on:
  pull_request:
    paths: ["panel_nodex/**", "backend/**", ".github/workflows/panel-y-reglas.yml"]
  push:
    branches: [main, develop]
    paths: ["panel_nodex/**", "backend/**", ".github/workflows/panel-y-reglas.yml"]

jobs:
  panel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panel_nodex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: panel_nodex/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Sin variables de Firebase compila en modo demo: comprueba que todo construye
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  reglas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run probar:reglas
      - run: node --check functions/index.js
